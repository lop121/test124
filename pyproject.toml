[project]
name = "payment-processing"
version = "0.1.0"
description = "Asynchronous payment processing with a transactional outbox"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "faststream[rabbit]>=0.6,<0.7",
    "httpx>=0.28,<1",
    "loguru>=0.7,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]
